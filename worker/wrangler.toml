name = "frameposer-store"
main = "src/index.js"
compatibility_date = "2026-09-09"

# minimum version old clients must beat. newer test builds still work
[vars]
LATEST_VERSION = "1.3.5"

[cache]
enabled = true

[placement]
mode = "smart"

[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "frameposer-poses"
database_id = "ed7acff9-f56d-4d32-a5bb-59cafae06e24"
